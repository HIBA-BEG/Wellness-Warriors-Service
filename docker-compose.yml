services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/WellnessWarrior
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Compose}
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
    depends_on:
      - mongodb

volumes:
  mongodb_data:
